<html lang="en" dir="ltr">

<title>Vitamin D Calculator — Pol</title>
<meta name="description" content="A quick, anonymous vitamin D daily intake estimate from Pol.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ==========================================================
   POL — shared design tokens (mirrors polvisit.com)
   ========================================================== */
:root{
  --pine-green:#22523C;
  --pine-deep:#16382A;
  --sage-deep:#3E7355;
  --gold:#D6A63C;
  --gold-bright:#E4B854;
  --gold-soft:rgba(214,166,60,.14);
  --parchment:#F4ECDB;
  --parchment-deep:#EADFC5;
  --line:rgba(22,56,42,.14);
  --ink:#1E2B22;
  --ink-70:rgba(30,43,34,.72);
  --ink-45:rgba(30,43,34,.48);
  --cream:#F6F0E2;
  --danger:#A5432E;
  --danger-soft:rgba(165,67,46,.09);

  --display:"Instrument Serif","Vazirmatn",Georgia,serif;
  --body:"Vazirmatn",system-ui,-apple-system,sans-serif;
  --r-sm:10px; --r-md:16px; --r-lg:24px;
  --shadow:0 18px 40px -24px rgba(16,45,32,.35);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; min-height:100vh;
  background:var(--parchment); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
}
button{font-family:inherit;}
[dir="rtl"] body{font-family:var(--body);}

.display{font-family:var(--display); font-weight:400; letter-spacing:-.01em; line-height:1.12;}
[dir="rtl"] .display{font-family:var(--body); font-weight:800; letter-spacing:0; line-height:1.5;}

/* ---- header + bridge progress ---- */
header{
  position:sticky; top:0; z-index:20;
  background:rgba(244,236,219,.95); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.head-row{
  max-width:560px; margin:0 auto; padding:16px 20px 12px;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
}
.brand{display:inline-flex; align-items:center; text-decoration:none;}
.brand-logo{height:34px; width:auto; display:block;}
.lang{display:flex; border-radius:999px; overflow:hidden; border:1.5px solid var(--line); flex:none;}
.lang button{
  font-size:12px; font-weight:700; padding:7px 12px; border:0; background:transparent;
  color:var(--ink-45); cursor:pointer; transition:background .15s,color .15s;
}
.lang button.on{background:var(--pine-green); color:var(--cream);}

.bridge-wrap{max-width:560px; margin:0 auto; padding:0 20px 14px; position:relative;}
.bridge-svg{width:100%; height:20px; display:block; overflow:visible;}
.bridge-base{stroke:var(--line); stroke-width:2; fill:none; stroke-linecap:round;}
.bridge-fill{stroke:var(--gold); stroke-width:2.5; fill:none; stroke-linecap:round; transition:stroke-dashoffset .55s cubic-bezier(.4,0,.2,1);}

/* ---- layout ---- */
main{flex:1; display:flex;}
.stage{max-width:560px; margin:0 auto; padding:28px 20px 40px; width:100%;}
.card{
  background:var(--cream); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:30px 26px; box-shadow:var(--shadow);
  animation:rise .38s cubic-bezier(.22,.68,.28,1) both;
}
@keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none;} .bridge-fill{transition:none;}}

.step-eyebrow{
  font-size:12.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--sage-deep); margin-bottom:10px;
}
[dir="rtl"] .step-eyebrow{letter-spacing:0; text-transform:none; font-size:14.5px;}
.step-q{font-size:clamp(21px,4vw,26px); margin-bottom:6px;}
[dir="rtl"] .step-q{font-size:clamp(19px,3.6vw,23px);}
.step-help{font-size:14.5px; color:var(--ink-45); margin-bottom:22px;}

/* ---- options ---- */
.opt-list{display:flex; flex-direction:column; gap:10px; margin-bottom:6px;}
.opt{
  display:flex; align-items:flex-start; gap:12px;
  border:1.5px solid var(--line); border-radius:var(--r-md);
  padding:14px 16px; cursor:pointer; background:var(--parchment);
  transition:border-color .15s ease, background .15s ease;
  text-align:start;
}
.opt:hover{border-color:var(--sage-deep);}
.opt.checked{border-color:var(--pine-green); background:var(--gold-soft);}
.opt .box{
  width:20px; height:20px; border-radius:6px; border:1.5px solid var(--ink-45);
  flex:none; margin-top:1px; display:grid; place-items:center; background:var(--cream);
}
.opt.radio .box{border-radius:50%;}
.opt.checked .box{border-color:var(--pine-green); background:var(--pine-green);}
.opt .box svg{width:12px; height:12px; stroke:var(--cream); fill:none; stroke-width:3; opacity:0;}
.opt.checked .box svg{opacity:1;}
.opt .text{display:flex; flex-direction:column; gap:3px;}
.opt .lbl{font-size:15.5px; font-weight:600; line-height:1.4;}
.opt .sub{display:block; font-size:13px; color:var(--ink-45); line-height:1.4;}

/* ---- inputs ---- */
.field{margin-bottom:16px;}
.field label{display:block; font-size:14px; font-weight:700; color:var(--ink-70); margin-bottom:7px;}
.field .unit-input{position:relative;}
.field input[type="number"]{
  width:100%; font-family:inherit; font-size:22px; font-weight:700; color:var(--ink);
  border:1.5px solid var(--line); border-radius:var(--r-sm); background:var(--parchment);
  padding:13px 52px 13px 16px; -moz-appearance:textfield;
}
[dir="rtl"] .field input[type="number"]{padding:13px 16px 13px 52px; text-align:right;}
.field input:focus{outline:none; border-color:var(--pine-green);}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
.field .unit{
  position:absolute; inset-inline-end:16px; top:50%; transform:translateY(-50%);
  font-size:13.5px; font-weight:700; color:var(--ink-45); pointer-events:none;
}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:14px;}

/* ---- nav buttons ---- */
.nav-row{display:flex; gap:12px; margin-top:24px;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:14px 22px; border-radius:999px; border:1.5px solid transparent;
  font-weight:700; font-size:15px; cursor:pointer; text-decoration:none; line-height:1;
  transition:transform .16s ease, background .16s ease, opacity .16s ease;
}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn-primary{background:var(--gold); color:#1E2B14; flex:1;}
.btn-primary:not(:disabled):hover{background:var(--gold-bright); transform:translateY(-1px);}
.btn-ghost{background:transparent; color:var(--ink-70); border-color:var(--line);}
.btn-ghost:hover{border-color:var(--ink-45);}
.btn-block{width:100%;}

/* ---- safety stop / result ---- */
.icon-badge{
  width:56px; height:56px; border-radius:50%; display:grid; place-items:center;
  margin-bottom:18px;
}
.icon-badge.stop{background:var(--danger-soft);}
.icon-badge.stop svg{width:26px; height:26px; stroke:var(--danger); fill:none; stroke-width:2.2;}
.icon-badge.ok{background:var(--gold-soft);}
.icon-badge.ok svg{width:26px; height:26px; stroke:var(--pine-green); fill:none; stroke-width:2.2;}

.result-figure{
  text-align:center; padding:26px 10px 22px; border-radius:var(--r-md);
  background:var(--pine-green); color:var(--cream); margin-bottom:18px;
}
.result-number{font-family:var(--display); font-size:52px; color:var(--gold-bright); line-height:1;}
[dir="rtl"] .result-number{font-family:var(--body); font-weight:800; font-size:44px;}
.result-unit{font-size:14px; color:var(--cream); opacity:.8; margin-top:6px; font-weight:600;}
.combined-note{font-size:14.5px; color:var(--ink-70); text-align:center; margin:0 0 16px; line-height:1.55;}
.note-box{
  border:1px solid rgba(214,166,60,.4); background:var(--gold-soft); border-radius:var(--r-sm);
  padding:13px 15px; font-size:14px; color:var(--ink-70); margin-bottom:14px;
}
.disclaimer{
  border:1px dashed var(--line); border-radius:var(--r-sm); padding:13px 15px;
  font-size:13.5px; color:var(--ink-45); margin-bottom:20px; text-align:center;
}
.stop-text{font-size:16px; color:var(--ink-70); margin-bottom:22px; line-height:1.6;}

/* ---- footer ---- */
footer{padding:24px 20px 34px; text-align:center;}
footer p{font-size:12.5px; color:var(--ink-45); max-width:520px; margin:0 auto;}

@media (max-width:400px){
  .card{padding:24px 18px;}
  .two-col{gap:10px;}
}
</style>
</head>

/* ==========================================================
   State
   ========================================================== */
const S = {
  step:"safety",
  safety:new Set(),
  age:null, sex:null, pregnancy:null,
  weight:null, height:null,
  location:null, sun:null
};

function applicableSteps(){
  const list = ["safety","age","sex"];
  if (S.sex === "female") list.push("pregnancy");
  list.push("body","location","sun");
  return list;
}

function updateBridge(){
  const steps = applicableSteps();
  const idx = steps.indexOf(S.step);
  const path = document.getElementById("bridgeFill");
  const len = path.getTotalLength();
  path.style.strokeDasharray = len;
  let pct = 0;
  if (S.step === "result") pct = 1;
  else if (idx >= 0) pct = idx / steps.length;
  if (I18N.lang === "fa"){
    path.style.strokeDashoffset = -(len - len*pct);
    path.setAttribute("transform", "scale(-1,1) translate(-520,0)"); // mirror for RTL fill direction
  } else {
    path.style.strokeDashoffset = len - len*pct;
    path.removeAttribute("transform");
  }
}

/* ==========================================================
   UI helpers
   ========================================================== */
function t(node){ return node[I18N.lang]; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function optionRow({checked, radio, label, sub}){
  return '<label class="opt ' + (radio?'radio':'') + (checked?' checked':'') + '">' +
    '<span class="box"><svg viewBox="0 0 24 24"><use href="#ico-check"/></svg></span>' +
    '<span class="text"><span class="lbl">' + esc(label) + '</span>' + (sub?'<span class="sub">('+esc(sub)+')</span>':'') + '</span>' +
  '</label>';
}

function navRow({canNext, nextLabel, showBack, onNext}){
  return '<div class="nav-row">' +
    (showBack ? '<button class="btn btn-ghost" id="btnBack">' + esc(t(T.back)) + '</button>' : '') +
    '<button class="btn btn-primary" id="btnNext" ' + (canNext?'':'disabled') + '>' + esc(nextLabel || t(T.next)) + '</button>' +
  '</div>';
}

function goBack(){
  const steps = applicableSteps();
  const idx = steps.indexOf(S.step);
  if (idx > 0){ S.step = steps[idx-1]; render(); }
}
function goNext(nextId){ S.step = nextId; render(); }

/* ==========================================================
   Step renderers
   ========================================================== */
function renderSafety(){
  const canNext = S.safety.size > 0;
  const opts = T.safety.opts.map(o=>{
    const checked = S.safety.has(o.id);
    return '<div class="opt-row" data-id="' + o.id + '">' + optionRow({checked, radio:false, label:t(o)}) + '</div>';
  }).join("");
  return '<div class="card">' +
    '<div class="step-eyebrow">' + esc(t(T.safety.eyebrow)) + '</div>' +
    '<div class="step-q display">' + esc(t(T.safety.q)) + '</div>' +
    '<div class="step-help">' + esc(t(T.safety.help)) + '</div>' +
    '<div class="opt-list">' + opts + '</div>' +
    navRow({canNext, showBack:false}) +
  '</div>';
}
function wireSafety(){
  document.querySelectorAll(".opt-row").forEach(row=>{
    row.addEventListener("click", ()=>{
      const id = row.dataset.id;
      if (id === "none"){ S.safety = S.safety.has("none") ? new Set() : new Set(["none"]); }
      else {
        S.safety.delete("none");
        S.safety.has(id) ? S.safety.delete(id) : S.safety.add(id);
      }
      render();
    });
  });
  document.getElementById("btnNext").addEventListener("click", ()=>{
    if (S.safety.size === 1 && S.safety.has("none")) goNext("age");
    else goNext("stopped");
  });
}

function renderStopped(){
  return '<div class="card">' +
    '<div class="icon-badge stop"><svg><use href="#ico-stop"/></svg></div>' +
    '<div class="step-eyebrow">' + esc(t(T.stopped.eyebrow)) + '</div>' +
    '<div class="step-q display" style="margin-bottom:14px;">' + esc(t(T.stopped.title)) + '</div>' +
    '<p class="stop-text">' + esc(t(T.stopped.text)) + '</p>' +
    '<a class="btn btn-primary btn-block" href="https://t.me/polvisitbot" target="_blank" rel="noopener">' + esc(t(T.bookCta)) + '</a>' +
    '<div class="nav-row"><button class="btn btn-ghost btn-block" id="btnBack">' + esc(t(T.back)) + '</button></div>' +
  '</div>';
}
function wireStopped(){
  document.getElementById("btnBack").addEventListener("click", ()=>{ S.step = "safety"; render(); });
}

function renderAge(){
  const canNext = Number.isFinite(S.age) && S.age >= 1 && S.age <= 120;

    '<div class="step-eyebrow">' + esc(t(T.age.eyebrow)) + '</div>' +

    '<div class="field" style="margin-top:22px;"><div class="unit-input">' +
      '<input type="number" id="ageInput" inputmode="numeric" min="1" max="120" value="' + (S.age ?? "") + '">' +
      '<span class="unit">' + esc(t(T.age.unit)) + '</span>' +
    '</div></div>' +
    navRow({canNext, showBack:false}) +
  '</div>';
}
function wireAge(){

  const opts = T.location.opts.map(o=>'<div class="opt-row" data-id="'+o.id+'">' +
    optionRow({checked:S.location===o.id, radio:true, label:t(o), sub:I18N.lang==="fa"?o.sub_fa:o.sub_en}) + '</div>').join("");
  return '<div class="card">' +
    '<div class="step-eyebrow">' + esc(t(T.location.eyebrow)) + '</div>' +

function wireSun(){
  document.querySelectorAll(".opt-row").forEach(row=>{
    row.addEventListener("click", ()=>{ S.sun = row.dataset.id; render(); });

  document.getElementById("btnBack").addEventListener("click", goBack);
  document.getElementById("btnNext").addEventListener("click", ()=> goNext("result"));

/* ==========================================================
   Calculation — see spec order exactly
   ========================================================== */
function calculate(){
  const isPregOrFeed = S.pregnancy === "pregnant" || S.pregnancy === "breastfeeding";
  let base = S.age >= 71 ? 2000 : 1500;
  if (isPregOrFeed) base = 2000;

  const heightM = S.height / 100;
  const bmi = S.weight / (heightM * heightM);
  let bmiMult = 1;
  if (bmi >= 30) bmiMult = 2;
  else if (bmi >= 25) bmiMult = 1.5;

  let raw = base * bmiMult;

  raw += S.location === "high" ? 600 : (S.location === "moderate" ? 400 : 0);
  raw += S.sun === "rare" ? 400 : (S.sun === "regular" ? -400 : 0);

  raw = Math.max(0, raw);

  let capped = false;
  if (raw > 4000){ raw = 4000; capped = true; }

  const buckets = [1000,1500,2000,2500,3000,3500,4000];
  const result = buckets.find(v => v >= raw) ?? 4000;

  return { result, capped, isPregOrFeed, bmi };
}

function renderResult(){
  const { result, capped, isPregOrFeed } = calculate();
  const numDisplay = I18N.lang === "fa" ? toFa(result) : result.toLocaleString("en-US");
  return '<div class="card">' +
    '<div class="icon-badge ok"><svg><use href="#ico-ok"/></svg></div>' +
    '<div class="step-eyebrow">' + esc(t(T.result.eyebrow)) + '</div>' +
    '<div class="step-q display" style="margin-bottom:18px;">' + esc(t(T.result.title)) + '</div>' +
    '<div class="result-figure">' +
      '<div class="result-number">' + numDisplay + '</div>' +
      '<div class="result-unit">' + esc(t(T.result.unit)) + '</div>' +
    '</div>' +
    '<p class="combined-note">' + esc(t(T.result.combined)) + '</p>' +
    (isPregOrFeed ? '<div class="note-box">' + esc(t(T.result.pregNote)) + '</div>' : '') +
    (capped ? '<div class="note-box">' + esc(t(T.result.capNote)) + '</div>' : '') +
    '<div class="disclaimer">' + esc(t(T.result.disclaimer)) + '</div>' +
    '<a class="btn btn-primary btn-block" href="https://t.me/polvisitbot" target="_blank" rel="noopener">' + esc(t(T.bookCta)) + '</a>' +
    '<div class="nav-row"><button class="btn btn-ghost btn-block" id="btnRestart">' + esc(t(T.startOver)) + '</button></div>' +
  '</div>';
}
function wireResult(){
  document.getElementById("btnRestart").addEventListener("click", ()=>{
    Object.assign(S, {step:"safety", safety:new Set(), age:null, sex:null, pregnancy:null, weight:null, height:null, location:null, sun:null});
    render();
  });
}

function syncNext(){
  const btn = document.getElementById("btnNext");
  if (!btn) return;
  let ok = false;
  if (S.step === "age") ok = Number.isFinite(S.age) && S.age >= 1 && S.age <= 120;
  if (S.step === "body") ok = S.weight > 0 && S.height > 0;
  btn.disabled = !ok;
}

/* ==========================================================
   Render dispatch
   ========================================================== */
const RENDERERS = {
  safety:[renderSafety, wireSafety],
  stopped:[renderStopped, wireStopped],
  age:[renderAge, wireAge],
  sex:[renderSex, wireSex],
  pregnancy:[renderPregnancy, wirePregnancy],
  body:[renderBody, wireBody],
  location:[renderLocation, wireLocation],
  sun:[renderSun, wireSun],
  result:[renderResult, wireResult]
};

function render(){
  const [draw, wire] = RENDERERS[S.step];
  document.getElementById("stage").innerHTML = draw();
  wire();
  updateBridge();
  window.scrollTo({top:0, behavior:"instant"});
}

document.querySelectorAll(".lang button").forEach(b=>{
  b.addEventListener("click", ()=> I18N.set(b.dataset.lang));
});

I18N.set("en");
</script>
